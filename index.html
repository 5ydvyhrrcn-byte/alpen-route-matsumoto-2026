<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>松本の思い出</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f7f5f0;color:#3e4038}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}
h1{text-align:center;font-size:28px;margin:8px 0 4px}.sub{text-align:center;color:#777;margin:0 0 20px}
.hero{height:220px;border-radius:22px;overflow:hidden;background:#ddd;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.hero img,.cover img{width:100%;height:100%;object-fit:cover}.placeholder{color:#888;padding:20px;text-align:center}
.grid{display:grid;gap:14px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 3px 12px #00000012;cursor:pointer;position:relative}
.cover{height:145px;background:#e4e2db;display:flex;align-items:center;justify-content:center}.cardbody{padding:14px}.card h2{margin:0 0 4px;font-size:20px}.card p{margin:0;color:#777;font-size:13px}
.page{display:none}.page.active{display:block}.back{border:0;background:none;padding:6px 0;font-size:16px;color:#555}
.page h2{font-size:25px;margin:8px 0 14px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button,.pick{border:0;border-radius:12px;background:#fff;padding:10px 13px;box-shadow:0 2px 8px #00000010;font-size:14px}.pick{display:inline-block;cursor:pointer}.pick input{display:none}
.album{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{background:#fff;border-radius:15px;overflow:hidden}.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.caption{padding:9px;font-size:13px}.caption input,.caption textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:7px;margin-top:5px;font:inherit}
.empty{text-align:center;color:#999;padding:30px 10px}
.backup{margin-top:30px;padding:16px;border-radius:18px;background:#ebe8df;text-align:center}.backup small{display:block;color:#777;margin-top:7px}
.note{font-size:12px;color:#777;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
<h1>松本の思い出</h1><p class="sub">家族で過ごした旅のアルバム</p>
<div id="homeHero" class="hero"><div class="placeholder">表紙写真を選べます</div></div>
<div class="tools"><label class="pick">📷 表紙写真を選ぶ<input id="heroInput" type="file" accept="image/*"></label></div>
<div id="cards" class="grid"></div>
<div class="backup">
<strong>💾 アルバムを保存</strong>
<div class="note">写真を追加・変更したら「アルバムを保存」を押してね。写真をHTMLの中に埋め込んだ新しいファイルを作るので、ブラウザの写真保存領域は使いません。</div>
<button onclick="downloadAlbum()">📦 写真入りHTMLを保存</button>
</div>
</section>

<div id="pages"></div>
</div>
<script>
const places=[
 {id:"castle",title:"松本城",emoji:"🏯",desc:"国宝・松本城の思い出"},
 {id:"alpen",title:"アルペンルート",emoji:"🏔️",desc:"立山黒部アルペンルートの思い出"},
 {id:"daio",title:"大王わさび農場",emoji:"🌿",desc:"わさび田と安曇野の思い出"},
 {id:"kai",title:"界 アルプス",emoji:"🌿",desc:"界 アルプスでの思い出"}
];
let data={
  hero:null,
  castle:{cover:null,photos:[]},alpen:{cover:null,photos:[]},
  daio:{cover:null,photos:[]},kai:{cover:null,photos:[]}
};
// If this file was generated from an already-saved album, embedded data can be inserted here.
const embedded=null;
if(embedded && embedded.version){data=embedded;}

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function imgBox(src,cls=""){return src?`<img class="${cls}" src="${src}">`:`<div class="placeholder">📷 写真を追加</div>`}
function renderHome(){
 document.getElementById("homeHero").innerHTML=imgBox(data.hero);
 const cards=document.getElementById("cards");
 cards.innerHTML=places.map(p=>`<div class="card" onclick="openPage('${p.id}')">
 <div class="cover">${imgBox(data[p.id].cover)}</div>
 <div class="cardbody"><h2>${p.emoji} ${p.title}</h2><p>${p.desc}　${data[p.id].photos.length}枚</p></div></div>`).join("");
}
function renderPage(id){
 const p=places.find(x=>x.id===id), d=data[id];
 document.getElementById("pages").innerHTML=`<section class="page active" id="page-${id}">
 <button class="back" onclick="goHome()">← 思い出一覧へ</button>
 <h2>${p.emoji} ${p.title}</h2>
 <div class="tools">
  <label class="pick">📷 入口写真を選ぶ<input type="file" accept="image/*" onchange="setCover('${id}',this.files[0])"></label>
  <label class="pick">📷 写真を追加<input type="file" accept="image/*" multiple onchange="addPhotos('${id}',this.files)"></label>
 </div>
 <div class="album">${d.photos.map((x,i)=>`<div class="photo"><img src="${x.src}"><div class="caption">
 <input value="${esc(x.title)}" placeholder="写真のタイトル" onchange="editPhoto('${id}',${i},'title',this.value)">
 <textarea rows="2" placeholder="思い出メモ" onchange="editPhoto('${id}',${i},'note',this.value)">${esc(x.note)}</textarea>
 <button onclick="removePhoto('${id}',${i})">🗑️ 削除</button>
 </div></div>`).join("")}</div>
 ${d.photos.length?`<div class="tools" style="margin-top:16px"><button onclick="downloadAlbum()">📦 この状態を写真入りHTMLで保存</button></div>`:`<div class="empty">まだ写真がありません。</div>`}
 </section>`;
}
function openPage(id){document.getElementById("home").style.display="none";renderPage(id);}
function goHome(){document.getElementById("pages").innerHTML="";document.getElementById("home").style.display="block";renderHome();}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function setCover(id,f){if(!f)return;data[id].cover=await readFile(f);renderPage(id);}
async function addPhotos(id,files){for(const f of files)data[id].photos.push({src:await readFile(f),title:"",note:""});renderPage(id);}
function editPhoto(id,i,k,v){data[id].photos[i][k]=v;}
function removePhoto(id,i){if(confirm("この写真を削除する？")){data[id].photos.splice(i,1);renderPage(id);}}
document.getElementById("heroInput").onchange=async e=>{if(e.target.files[0]){data.hero=await readFile(e.target.files[0]);renderHome();}};
function downloadAlbum(){
 const payload=JSON.stringify(data).replace(/</g,"\\u003c");
 const final=document.documentElement.outerHTML.replace("null",payload);
 const blob=new Blob(["<!doctype html>\n"+final],{type:"text/html;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="matsumoto_album_with_photos.html";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 alert("写真入りのHTMLを保存したよ📦\n次からは保存したHTMLを開けばOK！");
}
renderHome();
</script>
</body></html>
