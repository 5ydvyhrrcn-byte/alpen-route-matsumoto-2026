<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>松本の思い出</title>
<style>
:root{--bg:#f6f3ed;--card:#fff;--ink:#332f2a;--muted:#77716a;--line:#e5ded4;--accent:#687b62}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{padding:34px 18px 24px;text-align:center;background:#eee9df}
h1{margin:0 0 8px;font-size:28px;letter-spacing:.08em} .sub{color:var(--muted);font-size:13px}
main{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #00000008}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#eee;display:block}
.placeholder{aspect-ratio:16/9;border-radius:14px;background:#ebe6dd;display:flex;align-items:center;justify-content:center;color:#999}
button,label.btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:white;padding:11px 15px;font-size:14px;display:inline-block;cursor:pointer}
button.secondary,label.secondary{background:#e9e4dc;color:var(--ink)} button.danger{background:#9b6d68}
input[type=file]{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
h2{font-size:21px;margin:4px 0 12px} h3{font-size:16px;margin:14px 0 7px}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}
.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.photo input[type=text]{width:100%;margin-top:7px;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.photo .actions{margin-top:6px}.photo button{padding:7px 10px;font-size:12px}
.homebtn{display:block;width:100%;margin-top:12px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.savebox{border:2px solid #c9d0c4;background:#f8faf6}
.savebox h2{color:#52614e}.bigsave{width:100%;font-size:16px;padding:14px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>松本の思い出</h1>
  <div class="sub">写真を入れて、最後に「写真入りHTMLを保存」</div>
</header>
<main id="app"></main>
<script>
/*
  完全自己完結版。
  ブラウザ保存機能は一切使いません。
  写真は保存時にHTMLへ直接埋め込みます。
*/
const EMBEDDED_DATA = __EMBEDDED_DATA__;
let data = EMBEDDED_DATA;

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function readImage(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
function findCat(id){return data.categories.find(c=>c.id===id)}
function render(){
  const app=document.getElementById("app");
  app.innerHTML = `
    <section class="card">
      ${data.cover ? `<img class="cover" src="${data.cover}">` : `<div class="placeholder">表紙写真を入れてね</div>`}
      <div class="actions">
        <label class="btn" for="coverFile">📷 表紙写真を選ぶ</label>
        <input id="coverFile" type="file" accept="image/*">
      </div>
    </section>
    ${data.categories.map(c=>`
      <section class="card">
        <h2>${esc(c.name)}</h2>
        ${c.entry ? `<img class="cover" src="${c.entry}">` : `<div class="placeholder">入口・表紙写真</div>`}
        <div class="actions">
          <label class="btn" for="entry-${c.id}">📷 入口写真</label>
          <input id="entry-${c.id}" type="file" accept="image/*">
          <label class="btn secondary" for="photos-${c.id}">＋ 写真を追加</label>
          <input id="photos-${c.id}" type="file" accept="image/*" multiple>
        </div>
        <div class="grid">${c.photos.map((p,i)=>`
          <div class="photo">
            <img src="${p.src}">
            <input type="text" value="${esc(p.title||"")}" placeholder="写真のタイトル" data-title="${c.id}" data-index="${i}">
            <div class="actions">
              <button class="danger" data-delete="${c.id}" data-index="${i}">削除</button>
            </div>
          </div>`).join("")}</div>
        <button class="homebtn" data-top>↑ 上に戻る</button>
      </section>
    `).join("")}
    <section class="card savebox">
      <h2>💾 アルバムを保存</h2>
      <p class="note">このボタンを押すと、今入っている写真をHTMLの中へ直接入れた「新しいアルバム.html」を作ります。保存したHTMLを開けば、写真も一緒に表示されます。</p>
      <button class="bigsave" id="save">📦 写真入りHTMLを保存</button>
      <p class="note">※ 写真を追加しただけでは端末には保存されません。写真を入れたら、必ずこのボタンでHTMLを保存してね。</p>
    </section>
  `;
  bind();
}
function bind(){
  document.getElementById("coverFile").onchange=async e=>{
    if(e.target.files[0]){data.cover=await readImage(e.target.files[0]);render();}
  };
  data.categories.forEach(c=>{
    document.getElementById("entry-"+c.id).onchange=async e=>{
      if(e.target.files[0]){c.entry=await readImage(e.target.files[0]);render();}
    };
    document.getElementById("photos-"+c.id).onchange=async e=>{
      for(const f of e.target.files){
        c.photos.push({src:await readImage(f),title:""});
      }
      render();
    };
  });
  document.querySelectorAll("[data-title]").forEach(el=>{
    el.oninput=()=>{
      const c=findCat(el.dataset.title); c.photos[Number(el.dataset.index)].title=el.value;
    };
  });
  document.querySelectorAll("[data-delete]").forEach(b=>{
    b.onclick=()=>{
      const c=findCat(b.dataset.delete); c.photos.splice(Number(b.dataset.index),1); render();
    };
  });
  document.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>scrollTo({top:0,behavior:"smooth"}));
  document.getElementById("save").onclick=saveHtml;
}
function saveHtml(){
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  const source=document.documentElement.outerHTML.replace(
    "const EMBEDDED_DATA = __EMBEDDED_DATA__;",
    "const EMBEDDED_DATA = "+json+";"
  );
  const blob=new Blob(["<!doctype html>\n"+source],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="松本の思い出_写真入り.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  alert("写真入りHTMLを保存したよ。保存したファイルを開いて確認してね。");
}
render();
</script>
</body>
</html>
