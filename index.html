<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>松本の思い出</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f0e8;color:#38342f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{padding:38px 20px 30px;text-align:center;background:#e9e3d7}
h1{margin:0;font-size:30px;letter-spacing:.12em}
header p{margin:10px 0 0;color:#777;font-size:13px}
main{max-width:720px;margin:auto;padding:18px}
.home-cover{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 18px #0001}
.photo{width:100%;display:block;border-radius:14px;object-fit:cover}
.hero{aspect-ratio:16/10;background:#e7e2d9;display:flex;align-items:center;justify-content:center;color:#999}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label,button{border:0;border-radius:999px;padding:11px 15px;background:#697963;color:white;font-size:14px}
input[type=file]{display:none}
button.light,label.light{background:#e8e2d9;color:#38342f}
.menu{display:grid;gap:12px;margin-top:18px}
.place{background:#fff;border-radius:18px;padding:16px;border:1px solid #e3ddd3}
.place h2{margin:0 0 8px;font-size:19px}
.place p{margin:0;color:#777;font-size:13px}
.place button{margin-top:12px;width:100%}
.page{display:none}.page.active{display:block}
.back{background:#e8e2d9;color:#38342f;margin-bottom:14px}
.entry{margin-bottom:14px}
.entry .hero{border-radius:15px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.gallery figure{margin:0;background:#fff;padding:7px;border-radius:14px}
.gallery figcaption{font-size:12px;padding:7px 3px;color:#666}
.addbox{background:#fff;border:1px dashed #cfc7bb;border-radius:16px;padding:14px;margin-top:14px}
.small{font-size:12px;color:#777;line-height:1.7}
.notice{background:#f8f5ef;border-radius:14px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>松本の思い出</h1>
<p>旅の写真を、ゆっくり残していこう</p>
</header>
<main>
<section id="home" class="page active">
<div class="home-cover">
<div id="coverArea" class="hero">表紙写真を入れてね</div>
<div class="buttons">
<label for="coverInput">📷 表紙写真を選ぶ</label>
<input id="coverInput" type="file" accept="image/*">
</div>
</div>

<div class="notice small">
まずは「写真を選ぶ」と、その場でアルバムに写真が表示されるところから作っています。<br>
今回は保存機能をまだ入れていません。写真がちゃんと扱えることを確認してから、次に保存方法を決めます。
</div>

<div class="menu">
<div class="place"><h2>🏯 松本城</h2><p>松本城の思い出</p><button onclick="openPage('castle')">アルバムを見る</button></div>
<div class="place"><h2>🏔️ アルペンルート</h2><p>山・ダム・景色の思い出</p><button onclick="openPage('alpen')">アルバムを見る</button></div>
<div class="place"><h2>🌿 大王わさび農場</h2><p>水と緑の思い出</p><button onclick="openPage('daio')">アルバムを見る</button></div>
<div class="place"><h2>🌲 界 アルプス</h2><p>宿で過ごした思い出</p><button onclick="openPage('kai')">アルバムを見る</button></div>
</div>
</section>

<section id="castle" class="page"></section>
<section id="alpen" class="page"></section>
<section id="daio" class="page"></section>
<section id="kai" class="page"></section>
</main>

<script>
const names={castle:"🏯 松本城",alpen:"🏔️ アルペンルート",daio:"🌿 大王わさび農場",kai:"🌲 界 アルプス"};
const photos={castle:[],alpen:[],daio:[],kai:[]};
const entries={castle:"",alpen:"",daio:"",kai:""};
let cover="";

function read(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}
function openPage(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 renderPage(id);
 window.scrollTo(0,0);
}
function home(){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById('home').classList.add('active');
 window.scrollTo(0,0);
}
function renderPage(id){
 const el=document.getElementById(id);
 el.innerHTML=`
 <button class="back" onclick="home()">← トップへ戻る</button>
 <div class="place">
 <h2>${names[id]}</h2>
 <div class="entry">
 ${entries[id]?`<img class="photo hero" src="${entries[id]}">`:`<div class="hero">入口・表紙写真を入れてね</div>`}
 </div>
 <label for="entry-${id}">📷 入口写真を選ぶ</label>
 <input id="entry-${id}" type="file" accept="image/*">
 </div>
 <div class="addbox">
 <div class="small">このページの写真</div>
 <label for="photos-${id}">＋ 写真を追加</label>
 <input id="photos-${id}" type="file" accept="image/*" multiple>
 <div class="gallery">${photos[id].map(p=>`<figure><img src="${p}"></figure>`).join('')}</div>
 </div>`;
 document.getElementById(`entry-${id}`).onchange=async e=>{
  if(e.target.files[0]){entries[id]=await read(e.target.files[0]);renderPage(id);}
 };
 document.getElementById(`photos-${id}`).onchange=async e=>{
  for(const f of e.target.files) photos[id].push(await read(f));
  renderPage(id);
 };
}
document.getElementById('coverInput').onchange=async e=>{
 if(e.target.files[0]){
  cover=await read(e.target.files[0]);
  document.getElementById('coverArea').innerHTML=`<img class="photo hero" src="${cover}">`;
 }
};
</script>
</body>
</html>
